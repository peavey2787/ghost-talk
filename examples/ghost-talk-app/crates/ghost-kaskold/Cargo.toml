[package]
name = "ghost-kaskold"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ghost-api = { path = "../ghost-api" }
ghost-storage = { path = "../ghost-storage" }
vault-runtime.workspace = true
rand.workspace = true
zeroize.workspace = true
sha2.workspace = true
hex.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kaskold-sdk.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
kaskold-sdk = { git = "https://github.com/peavey2787/KasKold.git", rev = "21cf35cfc24c273fa3d92b1cb1495cc04d608e7c", default-features = false, features = ["wasm"] }
js-sys.workspace = true
getrandom = { version = "0.2.17", features = ["js"] }

[dev-dependencies]
# Cross-library contract: a Kaspa Portal PSKB must be accepted by KasKold.
kaspa-portal.workspace = true
serde_json.workspace = true
