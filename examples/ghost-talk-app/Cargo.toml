[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["crates/ghost-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "GPL-2.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
base64 = "0.22"
blake3 = "1"
sha2 = "0.10"
sha3 = "0.10"
rand = "0.8"
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "apple-app-store"] }
fs2 = "0.4.3"

# HYDRA is external and every directly consumed HYDRA crate is pinned to one commit.
hydra-msg = { git = "https://github.com/peavey2787/hydra-msg.git", rev = "a8b4b317cef85edce9d0f0528bb53125ebf6333b" }
hydra-core = { git = "https://github.com/peavey2787/hydra-msg.git", rev = "a8b4b317cef85edce9d0f0528bb53125ebf6333b" }
hydra-crypto = { git = "https://github.com/peavey2787/hydra-msg.git", rev = "a8b4b317cef85edce9d0f0528bb53125ebf6333b" }
hydra-stego = { git = "https://github.com/peavey2787/hydra-msg.git", rev = "a8b4b317cef85edce9d0f0528bb53125ebf6333b" }
hydra-group = { git = "https://github.com/peavey2787/hydra-msg.git", rev = "a8b4b317cef85edce9d0f0528bb53125ebf6333b" }
kaspa-portal = "1.0.1"
# Official Rusty-Kaspa v2.0.1 (Toccata) release; covenant-aware RPC is required by DotK proof.
kaspa-wrpc-client = { version = "2.0.1", git = "https://github.com/kaspanet/rusty-kaspa", rev = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3" }
kaspa-hashes = { version = "2.0.1", git = "https://github.com/kaspanet/rusty-kaspa", rev = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3" }
workflow-core = "0.18.0"
ghost-talk = { path = "../../crates/ghost-talk" }

[profile.dev.package."*"]
opt-level = 3
