[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["crates/ghost-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "GPL-2.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
base64 = "0.22"
blake3 = "1"
sha2 = "0.10"
sha3 = "0.10"
rand = "0.8"
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "apple-app-store"] }
fs2 = "0.4.3"

# HYDRA is external and every directly consumed HYDRA crate is pinned to one commit.
hydra-msg = { git = "https://github.com/peavey2787/hydra-msg.git", rev = "18dfb0e2ed78b657c86630e28db99a7f18978c22" }
hydra-core = { git = "https://github.com/peavey2787/hydra-msg.git", rev = "18dfb0e2ed78b657c86630e28db99a7f18978c22" }
hydra-crypto = { git = "https://github.com/peavey2787/hydra-msg.git", rev = "18dfb0e2ed78b657c86630e28db99a7f18978c22" }
hydra-stego = { git = "https://github.com/peavey2787/hydra-msg.git", rev = "18dfb0e2ed78b657c86630e28db99a7f18978c22" }
hydra-group = { git = "https://github.com/peavey2787/hydra-msg.git", rev = "18dfb0e2ed78b657c86630e28db99a7f18978c22" }
kaspa-portal = { git = "https://github.com/peavey2787/kaspa-portal.git", rev = "fd644f6a8755bb86f19c7c44707acadcfa484575" }
ghost-talk = { path = "../../crates/ghost-talk" }
# Shared realtime/voice contract and the p2p-net transport it drives. Kaspa
# Portal, HYDRA and p2p-net share one wasm-bindgen family, so all link together.
ghost-realtime = { path = "../../crates/ghost-realtime" }
p2p-net = { git = "https://github.com/peavey2787/p2p-net", rev = "1c0af490ef3f00aa945943d4a9a2e8dbbd767b2c" }
ghost-voice = { path = "../../crates/ghost-voice" }

[profile.dev.package."*"]
opt-level = 3
