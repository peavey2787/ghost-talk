[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["crates/ghost-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "GPL-2.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
base64 = "0.22"
blake3 = "1"
sha2 = "0.10"
sha3 = "0.10"
rand = "0.8"
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "apple-app-store"] }
fs2 = "0.4.3"

# HYDRA is external and every directly consumed HYDRA crate is pinned to one commit.
hydra-msg = { git = "https://github.com/peavey2787/hydra-msg.git", rev = "d90b387aaefbc20c5a686192e59c8c4b0d98cb26" }
hydra-core = { git = "https://github.com/peavey2787/hydra-msg.git", rev = "d90b387aaefbc20c5a686192e59c8c4b0d98cb26" }
hydra-crypto = { git = "https://github.com/peavey2787/hydra-msg.git", rev = "d90b387aaefbc20c5a686192e59c8c4b0d98cb26" }
hydra-stego = { git = "https://github.com/peavey2787/hydra-msg.git", rev = "d90b387aaefbc20c5a686192e59c8c4b0d98cb26" }
hydra-group = { git = "https://github.com/peavey2787/hydra-msg.git", rev = "d90b387aaefbc20c5a686192e59c8c4b0d98cb26" }
kaspa-portal = { git = "https://github.com/peavey2787/kaspa-portal.git", rev = "be7acfd183f092fcf57308116ac0fe9683b8813c" }
ghost-talk = { path = "../../crates/ghost-talk" }
# Shared realtime/voice contract and the p2p-net transport it drives. Kaspa
# Portal, HYDRA and p2p-net share one wasm-bindgen family, so all link together.
ghost-realtime = { path = "../../crates/ghost-realtime" }
p2p-net = { git = "https://github.com/peavey2787/p2p-net", rev = "3ade5744fe7f21747c0246965e557f3825626738" }
ghost-voice = { path = "../../crates/ghost-voice" }
# KasKold 2.0 import/backup/signing formats (upstream KasKold, v2 branch).
vault-runtime = { git = "https://github.com/peavey2787/KasKold.git", rev = "fff5e7cc2928c4baade3a7a4bd6695f8a2da4ed8" }
kaskold-sdk = { git = "https://github.com/peavey2787/KasKold.git", rev = "fff5e7cc2928c4baade3a7a4bd6695f8a2da4ed8" }

[profile.dev.package."*"]
opt-level = 3
