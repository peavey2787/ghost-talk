name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install quality tools
        run: |
          cargo install cargo-llvm-cov --locked
          cargo install wasm-pack --locked
          sudo apt-get update
          # Tauri (native app) system libraries plus Firefox for WASM tests.
          sudo apt-get install -y firefox clang libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Complete repository quality gates
        env:
          GHOST_TALK_NO_PAUSE: "1"
          GHOST_TALK_WASM_BROWSER: firefox
        run: bash scripts/run-all-tests.sh
